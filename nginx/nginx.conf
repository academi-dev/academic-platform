# ==============================================================================
# Academic Platform — Configuración de Gateway / Reverse Proxy (Nginx)
# Organización: academic-dev
# Equipo:
#   - Jean Mena (@hilton45)
#   - Eyfer Mena (@Eyfer3174)
# ==============================================================================
# Este archivo configura el proxy inverso de entrada para el ecosistema Academic:
#   - Enrutamiento de /api/* hacia academic-api:8000
#   - Enrutamiento de /rag/* hacia academic-rag:8001
#   - Acceso a documentación OpenAPI (/docs, /redoc, /openapi.json)
#   - Endpoint de salud unificado (/health)
#   - Cabeceras de seguridad y compresión gzip activadas
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de logs con tiempos de respuesta de upstream
    log_format main_custom '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" "$http_x_forwarded_for" '
                           'rt=$request_time uct="$upstream_connect_time" '
                           'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_custom;

    # Optimización de transferencia de archivos
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Compresión Gzip para respuestas JSON y texto
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/plain
        text/css
        text/xml
        application/xml
        application/xml+rss;

    # --------------------------------------------------------------------------
    # Definición de Upstreams (Microservicios en la red academic-net)
    # --------------------------------------------------------------------------
    upstream academic_api_backend {
        server academic-api:8000;
        keepalive 32;
    }

    upstream academic_rag_backend {
        server academic-rag:8000;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Servidor Virtual Principal (Puerto 80)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name localhost _;

        # Tamaño máximo permitido para subida de archivos (útil para syllabus/documentos en RAG)
        client_max_body_size 25M;

        # Cabeceras globales de seguridad HTTP
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # ----------------------------------------------------------------------
        # Endpoint de Salud del Gateway
        # ----------------------------------------------------------------------
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","service":"academic-gateway","version":"1.0.0"}\n';
        }

        # ----------------------------------------------------------------------
        # Rutas de la API Principal (academic-api:8000)
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://academic_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffers 8 16k;
        }

        # ----------------------------------------------------------------------
        # Rutas de la Documentación Swagger / OpenAPI (academic-api)
        # ----------------------------------------------------------------------
        location /docs {
            proxy_pass http://academic_api_backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /redoc {
            proxy_pass http://academic_api_backend/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://academic_api_backend/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------------------------
        # Rutas del Servicio RAG (academic-rag:8000 dentro de la red)
        # Enruta /rag/* eliminando el prefijo para la API interna de RAG
        # ----------------------------------------------------------------------
        location /rag/ {
            rewrite ^/rag/(.*)$ /$1 break;
            proxy_pass http://academic_rag_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Los modelos LLM y embeddings pueden tardar más tiempo en responder
            proxy_connect_timeout 15s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # ----------------------------------------------------------------------
        # Ruta Raíz: Redirección amigable a la documentación de la API
        # ----------------------------------------------------------------------
        location = / {
            return 302 /docs;
        }
    }
}
